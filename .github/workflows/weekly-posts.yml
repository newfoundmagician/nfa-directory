name: Weekly Post Generation

# Runs every Monday at 13:00 UTC (adjust the cron line below to change day/time —
# https://crontab.guru is helpful for editing this safely).
# Also runnable manually from the Actions tab via "Run workflow", useful for
# testing without waiting for the schedule.
#
# IMPORTANT: this workflow's "working-directory" is set to nfa-directory
# because that's where package.json and scripts/ actually live in this repo.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfa-directory
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate this week's posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-weekly-posts.mjs

      - name: Open a pull request with the new posts
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add weekly blog posts"
          title: "Weekly blog posts — ready for review"
          body: |
            Auto-generated by the weekly post workflow. Each post is grounded
            only in the business facts already in app/data/clients.json —
            nothing invented.

            **Review before merging**: read each new post for accuracy and
            tone, then merge this PR to publish. Closing it instead discards
            this week's batch with no effect on the live site.
          branch: weekly-posts/${{ github.run_id }}
          add-paths: nfa-directory/app/data/posts.json
